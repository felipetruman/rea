name: Optional REA extras smoke
on:
  push:
    branches: ["main", "feat/leanrea-ablation-optional-bridges"]
  pull_request:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - run: node --test tests/extras-integration.test.mjs
