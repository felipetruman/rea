name: Temporary generated evidence refresh
on:
  push:
    branches:
      - feat/leanrea-ablation-optional-bridges
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run evidence:generate
      - name: Commit updated skill provenance
        run: |
          if ! git diff --quiet -- docs/verification/managed-conformance-manifest.json docs/verification/managed-conformance-ledger.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/verification/managed-conformance-manifest.json docs/verification/managed-conformance-ledger.json
            git commit -m "chore: refresh evidence manifest for bundled skill integration"
            git push origin HEAD:feat/leanrea-ablation-optional-bridges
          fi
